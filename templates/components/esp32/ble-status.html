                <section class="control-group" aria-labelledby="esp32-status-heading">
                    <h3>Estado BLE</h3>
                    <div class="esp32-status-card">
                        <div class="esp32-status-row">
                            <span class="esp32-label">Estado</span>
                            <span id="esp32-status-badge" class="esp32-badge disconnected">Desconectado</span>
                        </div>
                        <div class="esp32-status-row">
                            <span class="esp32-label">Dispositivo</span>
                            <span id="esp32-device-name">--</span>
                        </div>
                        <label class="esp32-status-row" for="esp32-target-device-name">
                            <span class="esp32-label">Destino BLE</span>
                            <select id="esp32-target-device-name" class="esp32-input" data-action="esp32-set-target">
                                <option value="ESP32-FungiESP">ESP32-FungiESP</option>
                                <option value="ESP32-PanTiltPro">ESP32-PanTiltPro</option>
                                <option value="ESP32-CameraHead">ESP32-CameraHead</option>
                            </select>
                        </label>
                        <div class="esp32-status-row">
                            <span class="esp32-label">Dirección</span>
                            <span id="esp32-address">--</span>
                        </div>
                        <div class="esp32-status-row">
                            <span class="esp32-label">Último estado</span>
                            <span id="esp32-last-state">--</span>
                        </div>
                    </div>
                    <div class="esp32-actions">
                        <button id="bluetooth-enable-btn" class="btn-primary" data-action="bluetooth-enable" type="button">
                            <span class="btn-spinner hidden" aria-hidden="true"></span>
                            <span id="bluetooth-enable-label">Activar Bluetooth</span>
                        </button>
                        <button id="esp32-connect-btn" class="btn-primary" data-action="esp32-connect" type="button">
                            <span class="btn-spinner hidden" aria-hidden="true"></span>
                            <span id="esp32-connect-label">Conectar ESP32</span>
                        </button>
                        <button class="btn-danger" data-action="esp32-disconnect" type="button">Desconectar</button>
                    </div>
                    <div id="esp32-feedback" class="status-message hidden"></div>
                </section>

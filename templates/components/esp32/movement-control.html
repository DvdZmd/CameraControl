                <section class="control-group" aria-labelledby="esp32-movement-heading">
                    <h3>Control de movimiento</h3>
                    <div class="btn-grid esp32-move-grid" data-action-group="esp32-move">
                        <button class="esp32-move-btn move-up" type="button" data-value="up" aria-label="Mover arriba">↑</button>
                        <button class="esp32-move-btn move-left" type="button" data-value="left" aria-label="Mover izquierda">←</button>
                        <button class="esp32-center-pad-btn" type="button" data-action="esp32-center" aria-label="Centrar">Centro</button>
                        <button class="esp32-move-btn move-right" type="button" data-value="right" aria-label="Mover derecha">→</button>
                        <button class="esp32-move-btn move-down" type="button" data-value="down" aria-label="Mover abajo">↓</button>
                    </div>
                    <div class="esp32-status-card esp32-position-card">
                        <div class="esp32-status-row">
                            <span class="esp32-label">Posición configurada</span>
                            <span id="esp32-saved-position">--</span>
                        </div>
                        <div class="esp32-status-row">
                            <span class="esp32-label">Posición actual</span>
                            <span id="esp32-current-position">--</span>
                        </div>
                    </div>
                    <div class="esp32-actions">
                        <button class="btn-primary" data-action="esp32-save-current-position" type="button">Configurar posición actual</button>
                        <button type="button" data-action="esp32-return-position">Volver a posición</button>
                    </div>
                </section>

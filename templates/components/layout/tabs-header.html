            <div class="panel-header">
                <h1>Cámara IoT Pro <small>{{ camera_control.name }}</small></h1>
                <div class="tab-switcher" role="tablist" aria-label="Secciones de control">
                    <button type="button" class="tab-btn active" data-tab="home-tab" role="tab" aria-controls="home-tab" aria-selected="true">Home</button>
                    <button type="button" class="tab-btn" data-tab="camera-tab" role="tab" aria-controls="camera-tab" aria-selected="false">Cámara</button>
                    {% if camera_control.features.timelapse %}<button type="button" class="tab-btn" data-tab="timelapse-tab" role="tab" aria-controls="timelapse-tab" aria-selected="false">Timelapse</button>{% endif %}
                    {% if camera_control.features.esp32 %}<button type="button" class="tab-btn" data-tab="esp32-tab" role="tab" aria-controls="esp32-tab" aria-selected="false">ESP32</button>{% endif %}
                    {% if camera_control.features.sensors %}<button type="button" class="tab-btn" data-tab="sensors-tab" role="tab" aria-controls="sensors-tab" aria-selected="false">Sensores</button>{% endif %}
                    {% if camera_control.features.tuya %}<button type="button" class="tab-btn" data-tab="devices-tab" role="tab" aria-controls="devices-tab" aria-selected="false">Dispositivos</button>{% endif %}
                </div>
            </div>

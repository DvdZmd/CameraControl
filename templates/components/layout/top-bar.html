    <header class="global-light-bar" aria-label="Control global de iluminación">
        <div class="light-control-title">
            <span class="light-icon" aria-hidden="true">💡</span>
            <span>Iluminación</span>
        </div>
        <div class="raspberry-status" aria-label="Estado de Raspberry Pi">
            <span class="raspberry-status-item" title="Temperatura del procesador">
                Temp <strong id="pi-temperature">--</strong>
            </span>
            <span class="raspberry-status-item" title="Uso total del procesador">
                CPU <strong id="pi-cpu-usage">--</strong>
            </span>
            <span id="pi-power-status" class="raspberry-status-item status-unknown"
                  title="Estado de alimentación reportado por el firmware">
                Energía <strong id="pi-power-value">N/D</strong>
            </span>
            <div id="pi-storage-status" class="raspberry-storage status-unknown"
                 title="Espacio libre en el filesystem del timelapse">
                <div class="raspberry-storage-label">
                    <span>SD</span>
                    <strong id="pi-storage-value">N/D</strong>
                </div>
                <div id="pi-storage-progress" class="raspberry-storage-track" role="progressbar"
                     aria-label="Espacio libre en disco" aria-valuemin="0" aria-valuemax="100">
                    <span id="pi-storage-progress-bar"></span>
                </div>
            </div>
        </div>
        <div class="light-intensity-control">
            <label for="light-intensity-slider">
                Intensidad <span id="light-intensity-value">0%</span>
            </label>
            <input id="light-intensity-slider" data-action="set-light-intensity"
                   type="range" min="0" max="100" step="1" value="0">
        </div>
        <button id="light-toggle-btn" class="light-toggle-btn" data-action="toggle-esp32-light"
                type="button" aria-pressed="false" title="Controlar tira LED mediante ESP32">
            <span id="light-toggle-label">Prender luz</span>
        </button>
    </header>

            <section class="control-group">
                <h3>Orientación</h3>
                <div class="btn-grid" data-action-group="set-rotation">
                    <button data-value="0">0°</button>
                    <button data-value="90">90°</button>
                    <button data-value="180">180°</button>
                    <button data-value="270">270°</button>
                </div>
            </section>      
            <section class="control-group">
                <h3>Imagen (Hardware ISP)</h3>
                <div class="slider-item" data-control="Brightness">
                    <label>Brillo</label>
                    <input type="range" id="Brightness" min="-1.0" max="1.0" step="0.1" value="0.0" class="camera-slider">
                </div>
                <div class="slider-item">
                    <label>Contraste</label>
                    <input type="range" id="Contrast" min="0.0" max="10.0" step="0.1" value="1.0" class="camera-slider">
                </div>
                <div class="slider-item">
                    <label>Saturación</label>
                    <input type="range" id="Saturation" min="0.0" max="10.0" step="0.1" value="1.0" class="camera-slider">
                </div>
            </section>

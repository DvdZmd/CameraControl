<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiCam Ultra - Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="dashboard">
        <div class="stream-panel">
            <div class="status-bar">
                <span id="connection-status" class="status-online">● LIVE</span>
                <span id="resolution-label">1280x720 @ 30fps</span>
            </div>
            <div class="video-wrapper">
                <img id="video-feed" src="{{ url_for('camera_basic.video_feed') }}" alt="Camera Stream">
            </div>
        </div>

        <div class="controls-panel">
            <h1>Cámara IoT Pro</h1>
            
            <section class="control-group">
                <h3>Imagen (Hardware ISP)</h3>
                <div class="slider-item">
                    <label>Brillo</label>
                    <input type="range" id="Brightness" min="-1.0" max="1.0" step="0.1" value="0.0" class="camera-slider">
                </div>
                <div class="slider-item">
                    <label>Contraste</label>
                    <input type="range" id="Contrast" min="0.0" max="10.0" step="0.1" value="1.0" class="camera-slider">
                </div>
                <div class="slider-item">
                    <label>Saturación</label>
                    <input type="range" id="Saturation" min="0.0" max="10.0" step="0.1" value="1.0" class="camera-slider">
                </div>
            </section>

            <section class="control-group">
                <h3>Orientación</h3>
                <div class="btn-grid">
                    <button onclick="setRotation(0)">0°</button>
                    <button onclick="setRotation(90)">90°</button>
                    <button onclick="setRotation(180)">180°</button>
                    <button onclick="setRotation(270)">270°</button>
                </div>
            </section>

            <div class="slider-item">
                <label>Modo de Enfoque</label>
                <select id="AfMode" class="camera-slider-select" onchange="updateCameraSettings({'AfMode': this.value})">
                    <option value="2" selected>Continuo (AF-C)</option>
                    <option value="1">Automático (AF-S)</option>
                    <option value="0">Manual</option>
                </select>
            </div>
            
            <section class="control-group">
                <h3>Timelapse</h3>
                <div class="timelapse-controls">
                    <input type="number" id="interval" placeholder="Segundos" min="1" value="5">
                    <button id="btn-timelapse" class="btn-primary" onclick="toggleTimelapse()">Iniciar Timelapse</button>
                </div>
                <div id="timelapse-status" class="hidden">Capturando...</div>
            </section>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/camera.js') }}"></script>
</body>
</html>

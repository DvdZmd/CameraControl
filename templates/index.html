<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiCam Ultra - Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="dashboard">
        <div class="stream-panel">
            <div class="status-bar">
                <span id="connection-status" class="status-online">● LIVE</span>
                <span id="resolution-label">1280x720 @ 30fps</span>
            </div>
            <div class="video-wrapper">
                <img id="video-feed" src="{{ url_for('camera_controller.video_feed') }}" alt="Camera Stream">
            </div>
        </div>

        <div class="controls-panel">
            <h1>Cámara IoT Pro</h1>
            
            <section class="control-group">
                <h3>Imagen (Hardware ISP)</h3>
                <div class="slider-item">
                    <label>Brillo</label>
                    <input type="range" id="Brightness" min="-1.0" max="1.0" step="0.1" value="0.0" class="camera-slider">
                </div>
                <div class="slider-item">
                    <label>Contraste</label>
                    <input type="range" id="Contrast" min="0.0" max="10.0" step="0.1" value="1.0" class="camera-slider">
                </div>
                <div class="slider-item">
                    <label>Saturación</label>
                    <input type="range" id="Saturation" min="0.0" max="10.0" step="0.1" value="1.0" class="camera-slider">
                </div>
            </section>
            <section class="control-group">
                <h3>Configuración de Stream</h3>
                <div class="slider-item">
                    <section class="control-group">
                        <h3>Resolución</h3>
                        <div class="slider-item">
                            <select id="res-preset" onchange="handleResolutionChange(this.value)">
                                <option value="640x480">480p (VGA)</option>
                                <option value="1280x720" selected>720p (HD)</option>
                                <option value="1920x1080">1080p (Full HD)</option>
                                <option value="1640x1232">1640x1232</option>
                                <option value="custom">-- Personalizada --</option>
                            </select>
                        </div>
                        
                        <div id="custom-res-inputs" style="display: none; margin-top: 10px; gap: 5px; align-items: center;">
                            <input type="number" id="custom-w" placeholder="Ancho" style="width: 70px;">
                            <span>x</span>
                            <input type="number" id="custom-h" placeholder="Alto" style="width: 70px;">
                            <button onclick="applyCustomResolution()" class="btn-small">Aplicar</button>
                        </div>
                        <small id="max-res-hint" style="color: #888;"></small>
                    </section>
                </div>
            </section>
            <section class="control-group">
                <h3>Configuración de Captura (Foto)</h3>
                <div class="slider-item">
                    <label>Resolución de Foto</label>
                    <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                        <input type="number" id="photo-w" placeholder="Ancho" value="1920" style="width: 80px;">
                        <span>x</span>
                        <input type="number" id="photo-h" placeholder="Alto" value="1080" style="width: 80px;">
                    </div>
                    <button class="btn-primary" onclick="captureCustomPhoto()" style="width: 100%;">
                        📸 Tomar Foto Custom
                    </button>
                </div>
                <small id="sensor-max-label"></small> 
            </section>
            <section class="control-group">
                <h3>Orientación</h3>
                <div class="btn-grid">
                    <button onclick="setRotation(0)">0°</button>
                    <button onclick="setRotation(90)">90°</button>
                    <button onclick="setRotation(180)">180°</button>
                    <button onclick="setRotation(270)">270°</button>
                </div>
            </section>

            <div id="AfModeDiv" class="slider-item">
                <label>Modo de Enfoque</label>
                <select id="AfMode" class="camera-slider-select" onchange="updateCameraSettings({'AfMode': this.value})">
                    <option value="2" selected>Continuo (AF-C)</option>
                    <option value="1">Automático (AF-S)</option>
                    <option value="0">Manual</option>
                </select>
            </div>
            <div id="manual-focus-container" style="display: none;" class="slider-item">
                <label>Distancia de Enfoque (Manual)</label>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span>Infinito</span>
                    <input type="range" id="LensPosition" 
                        min="0.0" max="12.0" step="0.1" value="0.0" 
                        class="camera-slider" 
                        oninput="updateCameraSettings({LensPosition: parseFloat(this.value)})">
                    <span>Cerca</span>
                </div>
            </div>
            
            <section class="control-group">
                <h3>Configuración Timelapse</h3>
                <div class="slider-item">
                    <label>Intervalo (segundos)</label>
                    <input type="number" id="tl-interval" value="10" min="2" style="width: 100%;">
                </div>
                <div class="slider-item">
                    <label>Resolución de Captura</label>
                    <div style="display: flex; gap: 5px;">
                        <input type="number" id="tl-w" placeholder="Ancho" value="3840" style="width: 80px;">
                        <span>x</span>
                        <input type="number" id="tl-h" placeholder="Alto" value="2160" style="width: 80px;">
                    </div>
                    <p style="font-size: 0.7em; color: #888; margin-top: 5px;">
                        Sugerencia 4K: 3840x2160 | Máx V3: 4608x2592
                    </p>
                </div>
                <button id="btn-timelapse" class="btn-primary" onclick="toggleTimelapse()">
                    Iniciar Timelapse
                </button>
                <div id="timelapse-status" class="hidden" style="color: #00ff88; font-weight: bold; margin-top: 10px;">
                    ● Capturando en Alta Resolución...
                </div>
            </section>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/camera.js') }}"></script>
</body>
</html>
